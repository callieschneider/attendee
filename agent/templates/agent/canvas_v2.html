{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>Clever Star Canvas</title>
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  // Theme tokens reference CSS variables so a single `data-theme` flip
  // switches the entire palette. Linear-inspired: ultra-minimal, surgical
  // purple accent used only on primary actions / focus rings.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper:    "var(--bg)",        // base background
          surface:  "var(--surface)",   // elevated panels
          surface2: "var(--surface-2)", // double-elevated cards inside panels
          ink:      "var(--text)",      // primary text
          mute:     "var(--text-muted)",
          dim:      "var(--text-dim)",
          line:     "var(--border)",
          line2:    "var(--border-strong)",
          accent:   "var(--accent)",
          accent2:  "var(--accent-hover)",
          good:     "var(--good)",
          warn:     "var(--warn)",
          bad:      "var(--bad)",
        },
        fontFamily: {
          sans: ["Inter","ui-sans-serif","system-ui","-apple-system","Segoe UI","sans-serif"],
          mono: ["JetBrains Mono","ui-monospace","SFMono-Regular","Menlo","monospace"],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://rsms.me/" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<style>
  /* ── Theme tokens (Linear-inspired) ─────────────────────────────── */
  :root, [data-theme="dark"] {
    --bg:            #0c0c10;
    --surface:       #16161c;
    --surface-2:     #1c1c24;
    --text:          #e8e8ec;
    --text-muted:    #9ca3af;
    --text-dim:      #6b7280;
    --border:        #232730;
    --border-strong: #2e333d;
    --accent:        #5e6ad2;
    --accent-hover:  #4e5acb;
    --good:          #6ee7b7;
    --warn:          #fbbf24;
    --bad:           #fca5a5;
    /* Inline backdrop for the safe-area frame (the meeting tile crops
       outer pixels). Keeps a continuous color around the rounded
       canvas card. */
    --frame-bg:      #050507;
    --shadow:        0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,0.5);
  }
  [data-theme="light"] {
    --bg:            #ffffff;
    --surface:       #fafafa;
    --surface-2:     #f4f4f5;
    --text:          #0f0f14;
    --text-muted:    #5b6068;
    --text-dim:      #9aa0aa;
    --border:        #e6e7eb;
    --border-strong: #d4d6dd;
    --accent:        #5e6ad2;
    --accent-hover:  #4e5acb;
    --good:          #16a34a;
    --warn:          #b45309;
    --bad:           #dc2626;
    --frame-bg:      #f4f4f5;
    --shadow:        0 1px 0 rgba(0,0,0,0.02) inset, 0 8px 28px rgba(0,0,0,0.06);
  }

  html, body, #root { height: 100%; }
  body {
    background: var(--frame-bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    margin: 0;
  }

  /* JetBrains Mono fallback */
  @font-face {
    font-family: "JetBrains Mono";
    src: local("JetBrains Mono"), local("Menlo"), local("monospace");
    font-display: swap;
  }

  /* ── Safe-area frame ───────────────────────────────────────────────
     Meeting capture and Meet's screenshare both crop the outer ~3-5%
     of the viewport. We wrap the entire canvas in a uniform inset
     buffer so nothing important sits at the edge. The buffer is
     uniform (top/bottom/left/right same px) and the inner card has
     rounded outer corners for a polished look. The bot's own tab
     gets a slightly thicker buffer because Meet's video tile crops
     more aggressively than the user's own browser. */
  .canvas-frame {
    position: absolute;
    inset: var(--frame-padding, 28px);
    background: var(--bg);
    border-radius: 22px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  body.is-bot .canvas-frame { --frame-padding: 22px; border-radius: 18px; }

  /* ── Markdown body ───────────────────────────────────────────────── */
  .prose-clever {
    color: var(--text);
    line-height: 1.65;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .prose-clever h1, .prose-clever h2, .prose-clever h3 {
    color: var(--text);
    font-weight: 600;
    margin-top: 1.1em;
    margin-bottom: 0.5em;
    line-height: 1.25;
    letter-spacing: -0.02em;
  }
  .prose-clever h1 { font-size: 1.4em; }
  .prose-clever h2 { font-size: 1.18em; }
  .prose-clever h3 { font-size: 1.04em; }
  .prose-clever p  { margin: 0.55em 0; }
  .prose-clever ul, .prose-clever ol { margin: 0.55em 0 0.55em 1.25em; }
  .prose-clever li { margin: 0.2em 0; }
  .prose-clever code {
    background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.92em;
  }
  .prose-clever pre {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; overflow: auto; margin: 0.7em 0;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.9em;
  }
  .prose-clever blockquote {
    border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-muted);
    margin: 0.6em 0;
  }
  .prose-clever a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .prose-clever hr { border-color: var(--border); margin: 1em 0; }
  .prose-clever table { width: 100%; border-collapse: collapse; margin: 0.7em 0; font-size: 0.95em; }
  .prose-clever th, .prose-clever td { border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: left; }

  /* blinking cursor for streaming */
  .cursor-blink::after {
    content: "▋"; color: var(--accent); margin-left: 2px; animation: blink 1.05s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* tab underline animation */
  .tab-active { position: relative; color: var(--text) !important; }
  .tab-active::after {
    content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px;
    height: 2px; background: var(--accent); border-radius: 2px;
  }
  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
</style>
</head>
<body>
<div id="root" class="canvas-frame"></div>
<script>
  // The bot's own canvas tab passes ?client=bot. Meet's video tile crops
  // more than the user's browser viewport, so we apply a thicker frame
  // for the bot. CSS class selector handles the rest.
  if (new URLSearchParams(location.search).get("client") === "bot") {
    document.body.classList.add("is-bot");
  }
</script>

<script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "marked": "https://esm.sh/marked@13.0.3",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
</script>

<script type="module">
import React, { useEffect, useMemo, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import { marked } from "marked";
import htm from "htm";

const html = htm.bind(React.createElement);
const BOT_ID = "{{ bot_id|escapejs }}";
// "?client=bot" is set by the bot when it opens its own canvas tab.
// Anything else is treated as a real user — we wire up the driving signal.
const IS_BOT = new URLSearchParams(window.location.search).get("client") === "bot";

// Release driving when the user closes the tab.
if (!IS_BOT) {
  window.addEventListener("pagehide", () => {
    try {
      navigator.sendBeacon(
        `/agent/canvas/v2/${BOT_ID}/user-role`,
        new Blob([JSON.stringify({ driving: false })], { type: "application/json" }),
      );
    } catch {}
  });
}

// ── helpers ────────────────────────────────────────────────────────────────
function md(text) {
  if (!text) return { __html: "" };
  try {
    return { __html: marked.parse(text, { gfm: true, breaks: true }) };
  } catch (e) {
    return { __html: "<pre>" + String(text).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])) + "</pre>" };
  }
}
function fmtTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch { return ""; }
}
function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const diff = (d.getTime() - Date.now()) / 1000;
  const abs = Math.abs(diff);
  if (abs < 60) return diff < 0 ? "just now" : "soon";
  const mins = Math.round(diff / 60);
  if (Math.abs(mins) < 60) return mins < 0 ? `${-mins}m ago` : `in ${mins}m`;
  const hours = Math.round(mins / 60);
  if (Math.abs(hours) < 48) return hours < 0 ? `${-hours}h ago` : `in ${hours}h`;
  const days = Math.round(hours / 24);
  return days < 0 ? `${-days}d ago` : `in ${days}d`;
}

const TABS = [
  { id: "dashboard", label: "Dashboard" },
  { id: "notes",     label: "Notes" },
  { id: "tasks",     label: "Tasks" },
  { id: "focus",     label: "Focus" },
  { id: "browser",   label: "Browser" },
  { id: "history",   label: "History" },
  { id: "debug",     label: "Debug" },
];

// ── status pill ────────────────────────────────────────────────────────────
function StatusPill({ voice, userDriving }) {
  let label = "Idle", dot = "bg-mute", ring = "ring-mute/30";
  if (voice?.suspended) {
    label = "Asleep"; dot = "bg-mute"; ring = "ring-mute/30";
  } else if (voice?.gate_open) {
    label = "Listening"; dot = "bg-good"; ring = "ring-good/30";
  } else if (voice?.label === "speaking") {
    label = "Speaking"; dot = "bg-accent"; ring = "ring-accent/30";
  }
  return html`
    <div class="flex items-center gap-3">
      ${userDriving ? html`
        <div class="text-[11px] uppercase tracking-wider text-warn flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-warn animate-pulse"></span>User driving
        </div>` : null}
      <div class=${"flex items-center gap-2 px-3 py-1 rounded-full ring-1 " + ring + " bg-paper/60"}>
        <span class=${"w-2 h-2 rounded-full " + dot + " animate-pulse"}></span>
        <span class="text-xs font-medium text-ink">${label}</span>
      </div>
    </div>
  `;
}

// ── tab bar ────────────────────────────────────────────────────────────────
function TabBar({ active, onPick }) {
  return html`
    <div class="flex items-center gap-1 px-1">
      ${TABS.map(t => html`
        <button
          key=${t.id}
          onClick=${() => onPick(t.id)}
          class=${"px-3 py-2 text-sm rounded-md transition-colors " +
            (t.id === active
              ? "text-ink tab-active"
              : "text-mute hover:text-ink hover:bg-surface/60")}>
          ${t.label}
        </button>`)}
    </div>
  `;
}

// ── tab views ──────────────────────────────────────────────────────────────
function Dashboard({ snapshot }) {
  const dash = snapshot.dashboard || {};
  const tasks = snapshot.tasks || [];
  const focus = snapshot.focus || {};
  const dashEntries = Object.entries(dash);
  const highPri = tasks.filter(t => t.priority === "high" || t.priority === "critical").length;
  return html`
    <div class="h-full overflow-y-auto p-5 lg:p-6">
      ${dashEntries.length > 0 ? html`
        <div class="bg-surface border border-line rounded-xl px-4 py-3 mb-5">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            ${dashEntries.map(([k, v]) => html`
              <div key=${k} class="px-1">
                <div class="text-[10px] uppercase tracking-[0.12em] text-mute mb-0.5">${k.replaceAll("_", " ")}</div>
                <div class="text-sm font-medium text-ink break-words leading-snug">${typeof v === "object" ? JSON.stringify(v) : String(v)}</div>
              </div>`)}
          </div>
        </div>
      ` : null}
      <div class="grid grid-cols-12 gap-5">
        <div class="col-span-12 lg:col-span-7 flex flex-col gap-5 min-h-0">
          <div class="bg-surface border border-line rounded-xl p-5 min-h-[260px] max-h-[55vh] flex flex-col">
            <div class="flex items-center justify-between mb-2.5">
              <div class="text-[11px] uppercase tracking-[0.12em] text-mute">Focus</div>
              <span class="text-[11px] text-mute">${focus.session_id ? (focus.done ? "complete" : "thinking…") : "idle"}</span>
            </div>
            ${focus.text
              ? html`<div class=${"prose-clever flex-1 overflow-y-auto pr-1 " + (focus.done ? "" : "cursor-blink")} dangerouslySetInnerHTML=${md(focus.text)}></div>`
              : html`<div class="text-sm text-mute italic flex-1 flex items-center justify-center">When the agent thinks deeply, the result lands here.</div>`}
          </div>
          <div class="bg-surface border border-line rounded-xl p-5 min-h-[180px] max-h-[40vh] flex flex-col">
            <div class="flex items-center justify-between mb-2.5">
              <div class="text-[11px] uppercase tracking-[0.12em] text-mute">Notes</div>
              <span class="text-[11px] text-mute">${snapshot.notes_md ? `${(snapshot.notes_md.length / 1024).toFixed(1)} KB` : "empty"}</span>
            </div>
            ${snapshot.notes_md
              ? html`<div class="prose-clever flex-1 overflow-y-auto pr-1" dangerouslySetInnerHTML=${md(snapshot.notes_md.slice(-4000))}></div>`
              : html`<div class="text-sm text-mute italic flex-1 flex items-center justify-center">No notes yet — agent will write here as the meeting unfolds.</div>`}
          </div>
        </div>
        <div class="col-span-12 lg:col-span-5 flex flex-col gap-5 min-h-0">
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-surface border border-line rounded-xl p-4">
              <div class="text-[10px] uppercase tracking-[0.12em] text-mute mb-1">Series</div>
              <div class="text-sm font-medium text-ink truncate">${snapshot.series?.title || "—"}</div>
            </div>
            <div class="bg-surface border border-line rounded-xl p-4">
              <div class="text-[10px] uppercase tracking-[0.12em] text-mute mb-1">Open tasks</div>
              <div class="text-2xl font-semibold text-ink leading-none">${tasks.length}</div>
              <div class="text-[11px] text-mute mt-1">${highPri} high priority</div>
            </div>
          </div>
          <div class="bg-surface border border-line rounded-xl p-5 min-h-[300px] max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between mb-3">
              <div class="text-[11px] uppercase tracking-[0.12em] text-mute">Tasks</div>
              <span class="text-[11px] text-mute">${tasks.length} open</span>
            </div>
            <div class="flex-1 overflow-y-auto pr-1">
              ${tasks.length === 0
                ? html`<div class="text-sm text-mute italic h-full flex items-center justify-center">No open tasks for this series.</div>`
                : tasks.map(t => html`
                  <div key=${t.id} class="border-b border-line last:border-b-0 py-2.5 first:pt-0">
                    <div class="text-[14px] text-ink leading-snug mb-1.5">${t.title}</div>
                    <div class="flex items-center gap-1.5 text-[10px] text-mute">
                      <span class=${"px-1.5 py-0.5 rounded ring-1 capitalize " + statusClass(t.status)}>${t.status.replace("_"," ")}</span>
                      <span class=${"px-1.5 py-0.5 rounded ring-1 capitalize " + priorityClass(t.priority)}>${t.priority}</span>
                      ${t.owner ? html`<span class="text-mute">${t.owner}</span>` : null}
                      ${t.due_date ? html`<span class="text-mute">${relTime(t.due_date)}</span>` : null}
                    </div>
                  </div>`)}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function Notes({ snapshot }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) ref.current.scrollTop = ref.current.scrollHeight;
  }, [snapshot.notes_md]);
  return html`
    <div class="p-6 h-full flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-medium text-ink">Meeting Notes</h2>
        <span class="text-[11px] uppercase tracking-[0.12em] text-mute">live · agent-written</span>
      </div>
      <div ref=${ref} class="flex-1 overflow-y-auto bg-paper border border-line rounded-xl p-6">
        ${snapshot.notes_md
          ? html`<div class="prose-clever" dangerouslySetInnerHTML=${md(snapshot.notes_md)}></div>`
          : html`<div class="text-sm text-mute italic">Empty. Agent will append notes here.</div>`}
      </div>
    </div>
  `;
}

function priorityClass(p) {
  return ({
    critical: "bg-bad/15 text-bad ring-bad/30",
    high:     "bg-warn/15 text-warn ring-warn/30",
    medium:   "bg-accent/15 text-accent ring-accent/30",
    low:      "bg-surface text-mute ring-line",
  })[p] || "bg-surface text-mute ring-line";
}
function statusClass(s) {
  return ({
    todo:        "bg-surface text-mute ring-line",
    in_progress: "bg-accent/15 text-accent ring-accent/30",
    in_review:   "bg-accent2/15 text-accent2 ring-accent2/30",
    backlog:     "bg-surface text-mute ring-line",
    done:        "bg-good/10 text-good ring-good/20",
    cancelled:   "bg-surface text-mute ring-line",
  })[s] || "bg-surface text-mute ring-line";
}

function Tasks({ snapshot }) {
  const tasks = snapshot.tasks || [];
  return html`
    <div class="p-6 h-full flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-medium text-ink">Open Tasks</h2>
        <span class="text-[11px] uppercase tracking-[0.12em] text-mute">${tasks.length} open</span>
      </div>
      <div class="flex-1 overflow-y-auto">
        ${tasks.length === 0
          ? html`<div class="text-sm text-mute italic p-6 text-center bg-paper border border-line rounded-xl">No open tasks for this series.</div>`
          : tasks.map(t => html`
            <div key=${t.id} class="bg-paper border border-line rounded-xl p-4 mb-3 flex items-start gap-3">
              <div class="flex-1 min-w-0">
                <div class="text-[15px] font-medium text-ink leading-snug">${t.title}</div>
                <div class="mt-2 flex items-center gap-2 text-[11px]">
                  <span class=${"px-2 py-0.5 rounded-full ring-1 capitalize " + statusClass(t.status)}>${t.status.replace("_"," ")}</span>
                  <span class=${"px-2 py-0.5 rounded-full ring-1 capitalize " + priorityClass(t.priority)}>${t.priority}</span>
                  ${t.owner ? html`<span class="text-mute">· ${t.owner}</span>` : null}
                  ${t.due_date ? html`<span class="text-mute">· due ${relTime(t.due_date)}</span>` : null}
                </div>
              </div>
            </div>`)}
      </div>
    </div>
  `;
}

function Browser({ snapshot }) {
  const browser = snapshot.browser || {};
  const url = browser.url || "";
  const title = browser.title || "";
  // Phase 2: when the agent is driving a real headless Chrome we get
  // a stream of base64 PNGs over SSE; show those instead of the
  // iframe. Phase 1 iframe path stays as the fallback for pure
  // display URLs.
  const screencast = browser.screencast_b64 || "";
  const screencastTs = browser.screencast_ts || 0;
  const [iframeBlocked, setIframeBlocked] = useState(false);
  const [loadStart, setLoadStart] = useState(0);
  useEffect(() => {
    setIframeBlocked(false);
    setLoadStart(Date.now());
  }, [url]);
  useEffect(() => {
    if (!url || screencast) return;
    const t = setTimeout(() => setIframeBlocked(true), 8000);
    return () => clearTimeout(t);
  }, [url, loadStart, screencast]);

  if (screencast) {
    const stale = screencastTs && (Date.now() - screencastTs) > 5000;
    return html`
      <div class="p-6 h-full flex flex-col">
        <div class="flex items-center justify-between mb-3 gap-3">
          <div class="min-w-0">
            <div class="text-sm font-medium text-ink truncate">
              ${title || url || "Agent browser"}
              <span class="ml-2 text-[10px] uppercase tracking-[0.12em] text-good">live</span>
            </div>
            ${url ? html`<a href=${url} target="_blank" rel="noreferrer noopener"
              class="text-[11px] text-mute hover:text-accent truncate block">${url}</a>` : null}
          </div>
          ${stale ? html`<span class="text-[11px] uppercase tracking-[0.12em] text-warn px-2 py-1 rounded ring-1 ring-warn/40 bg-warn/10 shrink-0">stalled</span>` : null}
        </div>
        <div class="flex-1 bg-paper border border-line rounded-xl overflow-hidden relative flex items-center justify-center">
          <img src=${`data:image/png;base64,${screencast}`}
               class="w-full h-full object-contain bg-black"
               alt="agent browser screencast" />
        </div>
      </div>
    `;
  }

  if (!url) {
    return html`
      <div class="p-6 h-full flex flex-col items-center justify-center text-mute">
        <div class="text-sm italic">No page open. Ask the agent to pull up a URL.</div>
      </div>
    `;
  }
  return html`
    <div class="p-6 h-full flex flex-col">
      <div class="flex items-center justify-between mb-3 gap-3">
        <div class="min-w-0">
          <div class="text-sm font-medium text-ink truncate">${title || url}</div>
          <a href=${url} target="_blank" rel="noreferrer noopener"
             class="text-[11px] text-mute hover:text-accent truncate block">${url}</a>
        </div>
        ${iframeBlocked ? html`
          <a href=${url} target="_blank" rel="noreferrer noopener"
             class="text-[11px] uppercase tracking-[0.12em] text-warn px-2 py-1 rounded ring-1 ring-warn/40 bg-warn/10 hover:bg-warn/20 shrink-0">
            site blocked iframe — open in new tab
          </a>` : null}
      </div>
      <div class="flex-1 bg-paper border border-line rounded-xl overflow-hidden relative">
        <iframe
          src=${url}
          class="w-full h-full bg-white"
          referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox"
          onLoad=${() => setIframeBlocked(false)}
        ></iframe>
      </div>
    </div>
  `;
}

function relativeTime(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (isNaN(t)) return "";
  const d = (Date.now() - t) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d/60) + "m ago";
  if (d < 86400) return Math.floor(d/3600) + "h ago";
  if (d < 86400*7) return Math.floor(d/86400) + "d ago";
  return new Date(t).toLocaleDateString();
}

function History({ snapshot }) {
  const hist = snapshot.history || {};
  const visits    = hist.visits || [];
  const bookmarks = hist.bookmarks || [];
  const meetings  = hist.meetings || [];
  const series    = snapshot.series || null;
  const [filter, setFilter] = useState("");
  const f = filter.trim().toLowerCase();
  const matches = (s) => !f || (s || "").toLowerCase().includes(f);

  const filteredVisits = visits.filter(v => matches(v.url) || matches(v.title));
  const filteredBookmarks = bookmarks.filter(b =>
    matches(b.label) || matches(b.url) || matches(b.notes) || (b.tags || []).some(t => matches(t))
  );
  const filteredMeetings = meetings.filter(m => matches(m.title) || matches(m.summary));

  return html`
    <div class="p-6 space-y-5 overflow-y-auto h-full">
      <div class="flex items-baseline justify-between gap-3 flex-wrap">
        <div>
          <div class="text-xs uppercase tracking-[0.18em] text-mute">History</div>
          <div class="text-sm text-ink mt-1">
            ${series ? html`<span class="text-mute">series:</span> ${series.title}` : html`<span class="italic text-mute">no series — showing this meeting only</span>`}
          </div>
        </div>
        <input
          type="text"
          placeholder="filter URLs, labels, summaries…"
          value=${filter}
          onInput=${(e) => setFilter(e.target.value)}
          class="bg-bg2 border border-line rounded-md px-3 py-1.5 text-sm text-ink placeholder-mute focus:outline-none focus:ring-1 focus:ring-accent w-72"
        />
      </div>

      <section>
        <div class="text-xs uppercase tracking-[0.18em] text-mute mb-2">
          Bookmarks <span class="text-mute/70 normal-case tracking-normal">· ${filteredBookmarks.length}</span>
        </div>
        ${filteredBookmarks.length === 0 ? html`
          <div class="text-sm text-mute italic">No bookmarks yet. Ask the agent to save a link.</div>
        ` : html`
          <ul class="space-y-1.5">
            ${filteredBookmarks.map(b => html`
              <li key=${b.id} class="rounded-md border border-line bg-bg2/60 px-3 py-2 hover:border-accent/40 transition-colors">
                <div class="flex items-baseline justify-between gap-3">
                  <a href=${b.url} target="_blank" rel="noreferrer noopener" class="font-medium text-ink hover:text-accent text-sm">${b.label}</a>
                  <span class="text-[10px] uppercase tracking-[0.12em] text-mute shrink-0">${relativeTime(b.updated_at)}</span>
                </div>
                <a href=${b.url} target="_blank" rel="noreferrer noopener" class="block text-[11px] text-mute hover:text-accent truncate">${b.url}</a>
                ${b.notes ? html`<div class="text-xs text-ink/80 mt-1">${b.notes}</div>` : null}
                ${(b.tags || []).length > 0 ? html`
                  <div class="mt-1.5 flex gap-1 flex-wrap">
                    ${b.tags.map(t => html`<span class="text-[10px] uppercase tracking-[0.12em] text-mute px-1.5 py-0.5 rounded ring-1 ring-line">${t}</span>`)}
                  </div>` : null}
              </li>
            `)}
          </ul>
        `}
      </section>

      <section>
        <div class="text-xs uppercase tracking-[0.18em] text-mute mb-2">
          Browser history <span class="text-mute/70 normal-case tracking-normal">· ${filteredVisits.length}</span>
        </div>
        ${filteredVisits.length === 0 ? html`
          <div class="text-sm text-mute italic">No pages visited yet.</div>
        ` : html`
          <ul class="space-y-1">
            ${filteredVisits.map((v, i) => html`
              <li key=${i} class="flex items-baseline gap-3 py-1 border-b border-line/40 last:border-0">
                <span class="text-[10px] uppercase tracking-[0.12em] text-mute shrink-0 w-16">${relativeTime(v.visited_at)}</span>
                <a href=${v.url} target="_blank" rel="noreferrer noopener" class="flex-1 truncate text-sm text-ink hover:text-accent">
                  ${v.title || v.url}
                </a>
                <span class="text-[10px] uppercase tracking-[0.12em] text-mute shrink-0">${v.source}</span>
              </li>
            `)}
          </ul>
        `}
      </section>

      <section>
        <div class="text-xs uppercase tracking-[0.18em] text-mute mb-2">
          Past meetings <span class="text-mute/70 normal-case tracking-normal">· ${filteredMeetings.length}</span>
        </div>
        ${filteredMeetings.length === 0 ? html`
          <div class="text-sm text-mute italic">${series ? "No prior meetings in this series." : "Not in a series."}</div>
        ` : html`
          <ul class="space-y-1.5">
            ${filteredMeetings.map(m => html`
              <li key=${m.id} class="rounded-md border border-line bg-bg2/60 px-3 py-2">
                <div class="flex items-baseline justify-between gap-3">
                  <span class="font-medium text-ink text-sm truncate">${m.title}</span>
                  <span class="text-[10px] uppercase tracking-[0.12em] text-mute shrink-0">${relativeTime(m.started_at)}</span>
                </div>
                ${m.summary ? html`<div class="text-xs text-ink/70 mt-1 line-clamp-3">${m.summary}</div>` : null}
              </li>
            `)}
          </ul>
        `}
      </section>
    </div>
  `;
}

function Focus({ snapshot }) {
  const ref = useRef(null);
  const focus = snapshot.focus || {};
  useEffect(() => {
    if (ref.current) ref.current.scrollTop = ref.current.scrollHeight;
  }, [focus.text]);
  return html`
    <div class="p-6 h-full flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-medium text-ink">Focus</h2>
        <span class="text-[11px] uppercase tracking-[0.12em] text-mute">
          ${focus.session_id ? (focus.done ? "complete" : "thinking…") : "idle"}
        </span>
      </div>
      <div ref=${ref} class="flex-1 overflow-y-auto bg-paper border border-line rounded-xl p-6 prose-clever">
        ${focus.text
          ? html`<div class=${focus.done ? "" : "cursor-blink"} dangerouslySetInnerHTML=${md(focus.text)}></div>`
          : html`<div class="text-sm text-mute italic">When the agent uses think_deep, the streamed answer appears here.</div>`}
      </div>
    </div>
  `;
}

function Debug({ snapshot }) {
  const tx = snapshot.transcript || [];
  const ax = snapshot.action_log || [];
  return html`
    <div class="grid grid-cols-12 gap-4 p-6 h-full">
      <div class="col-span-12 lg:col-span-7 bg-paper border border-line rounded-xl p-4 overflow-hidden flex flex-col">
        <div class="text-[11px] uppercase tracking-[0.12em] text-mute mb-2">Transcript</div>
        <div class="flex-1 overflow-y-auto font-mono text-[12px] space-y-1">
          ${tx.map((e,i) => html`
            <div key=${i} class=${"flex gap-2 " + (e.is_self ? "text-accent" : "text-ink")}>
              <span class="text-mute shrink-0">${fmtTime(e.t)}</span>
              <span class="text-mute shrink-0">${(e.speaker||"?").slice(0,14)}</span>
              <span class="break-words">${e.text}</span>
            </div>`)}
        </div>
      </div>
      <div class="col-span-12 lg:col-span-5 bg-paper border border-line rounded-xl p-4 overflow-hidden flex flex-col">
        <div class="text-[11px] uppercase tracking-[0.12em] text-mute mb-2">Action log</div>
        <div class="flex-1 overflow-y-auto font-mono text-[12px] space-y-1">
          ${ax.map((a,i) => html`
            <div key=${i} class="flex gap-2">
              <span class="text-mute shrink-0">${fmtTime(a.t)}</span>
              <span class=${"shrink-0 " + (a.status === "ok" ? "text-good" : a.status === "error" ? "text-bad" : "text-warn")}>${a.status}</span>
              <span class="text-ink shrink-0">${a.tool}</span>
              ${a.latency_ms != null ? html`<span class="text-mute">${a.latency_ms}ms</span>` : null}
              ${a.error ? html`<span class="text-bad break-words">${a.error}</span>` : null}
            </div>`)}
        </div>
      </div>
    </div>
  `;
}

// ── main shell ─────────────────────────────────────────────────────────────
function App() {
  const [snap, setSnap] = useState(null);
  const [connected, setConnected] = useState(false);
  const [focusBuffer, setFocusBuffer] = useState({}); // {tab: {session_id, text}}

  useEffect(() => {
    let cancelled = false;
    async function bootstrap() {
      try {
        const r = await fetch(`/agent/canvas/v2/${BOT_ID}/state.json`, { cache: "no-store" });
        if (!cancelled && r.ok) {
          const j = await r.json();
          // Merge instead of replace so SSE-driven fields (like a fresh
          // browser screencast frame) don't get clobbered by a stale poll.
          setSnap(prev => prev ? {
            ...j,
            browser: { ...(j.browser || {}), ...(prev.browser || {}) },
          } : j);
        }
      } catch (e) { console.error("snapshot fetch", e); }
    }
    bootstrap();
    // Periodic re-fetch keeps transcript + action_log fresh on the
    // bot's video-tile chromedriver. Those lists only arrive in the
    // initial SSE snapshot; subsequent state events don't append to
    // them, so without polling they stay frozen at whatever was in
    // place when the canvas pump first connected.
    const refetchEvery = IS_BOT ? 4000 : 8000;
    const refetchTimer = setInterval(bootstrap, refetchEvery);

    const es = new EventSource(`/agent/canvas/v2/${BOT_ID}/stream`);
    es.onopen  = () => setConnected(true);
    es.onerror = () => setConnected(false);

    es.addEventListener("snapshot", ev => {
      try { setSnap(JSON.parse(ev.data)); } catch {}
    });

    es.addEventListener("state", ev => {
      let payload; try { payload = JSON.parse(ev.data); } catch { return; }
      const evt = payload?.data || {};
      // respawn_bot publishes this on the OLD bot's channel — the
      // user's open tab follows automatically without a manual click.
      if (evt.event === "moved" && evt.new_url) {
        try { es.close(); } catch {}
        window.location.replace(evt.new_url);
        return;
      }
      setSnap(prev => {
        if (!prev) return prev;
        const next = { ...prev };
        if (evt.event === "navigate" && evt.tab) next.active_tab = evt.tab;
        if (evt.event === "theme" && evt.theme) next.theme = evt.theme;
        if (evt.event === "notes") {
          if (evt.operation === "replace") next.notes_md = evt.text;
          else next.notes_md = (prev.notes_md || "") + (prev.notes_md ? "\n\n" : "") + evt.text;
        }
        if (evt.event === "dashboard") next.dashboard = { ...(prev.dashboard||{}), ...(evt.payload||{}) };
        if (evt.event === "focus") {
          next.focus = { ...(prev.focus||{}), session_id: evt.session_id, done: !!evt.done };
          if (evt.tab) next.active_tab = evt.tab;
        }
        if (evt.event === "browser") {
          next.browser = { url: evt.url || "", title: evt.title || "" };
          if (evt.tab) next.active_tab = evt.tab;
        }
        if (evt.event === "user_driving") next.user_driving = !!evt.driving;
        return next;
      });
    });

    es.addEventListener("browser", ev => {
      let payload; try { payload = JSON.parse(ev.data); } catch { return; }
      setSnap(prev => {
        if (!prev) return prev;
        const next = { ...prev };
        const cur = prev.browser || {};
        if (payload.event === "screencast_frame" && payload.png_b64) {
          next.browser = {
            ...cur,
            screencast_b64: payload.png_b64,
            screencast_ts: Date.now(),
          };
          // Auto-switch to the Browser tab when a fresh screencast lands,
          // unless the user is currently driving the canvas.
          if (!prev.user_driving) next.active_tab = "browser";
        } else if (payload.event === "screencast_stop") {
          next.browser = {
            url: cur.url || "",
            title: cur.title || "",
          };
        }
        return next;
      });
    });

    es.addEventListener("stream", ev => {
      let payload; try { payload = JSON.parse(ev.data); } catch { return; }
      const tab = payload.tab || "focus";
      const data = payload.data || {};
      if (tab === "focus") {
        setSnap(prev => {
          if (!prev) return prev;
          if (data.event === "start") {
            return {
              ...prev,
              focus: { session_id: data.session_id, text: "", done: false },
              active_tab: prev.user_driving ? prev.active_tab : "focus",
            };
          }
          if (data.event === "delta") {
            return {
              ...prev,
              focus: { ...(prev.focus||{}), session_id: data.session_id, text: data.text || "", done: false },
            };
          }
          if (data.event === "done") {
            return {
              ...prev,
              focus: { ...(prev.focus||{}), session_id: data.session_id, text: data.text || prev.focus?.text || "", done: true },
            };
          }
          return prev;
        });
      }
    });

    return () => {
      cancelled = true;
      try { clearInterval(refetchTimer); } catch {}
      try { es.close(); } catch {}
    };
  }, []);

  // Apply theme to the document so CSS variables flip.
  useEffect(() => {
    const t = snap?.theme === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  }, [snap?.theme]);

  const active = snap?.active_tab || "dashboard";
  const onPick = (tab) => {
    setSnap(prev => prev ? { ...prev, active_tab: tab } : prev);
    if (!IS_BOT) {
      fetch(`/agent/canvas/v2/${BOT_ID}/user-role`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ driving: true }),
      }).catch(() => {});
    }
    fetch(`/agent/canvas/v2/${BOT_ID}/navigate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tab }),
    }).catch(() => {});
  };

  if (!snap) {
    return html`
      <div class="h-full flex items-center justify-center text-mute text-sm">
        Connecting to canvas…
      </div>`;
  }

  let body;
  switch (active) {
    case "notes":     body = html`<${Notes}     snapshot=${snap}/>`; break;
    case "tasks":     body = html`<${Tasks}     snapshot=${snap}/>`; break;
    case "focus":     body = html`<${Focus}     snapshot=${snap}/>`; break;
    case "browser":   body = html`<${Browser}   snapshot=${snap}/>`; break;
    case "history":   body = html`<${History}   snapshot=${snap}/>`; break;
    case "debug":     body = html`<${Debug}     snapshot=${snap}/>`; break;
    default:          body = html`<${Dashboard} snapshot=${snap}/>`; break;
  }

  return html`
    <div class="h-full flex flex-col">
      <header class="border-b border-line bg-paper/80 backdrop-blur">
        <div class="flex items-center justify-between px-6 py-3">
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-md bg-gradient-to-br from-accent to-accent2 flex items-center justify-center">
              <span class="text-[11px] font-bold text-paper">CS</span>
            </div>
            <div class="leading-tight">
              <div class="text-[15px] font-semibold tracking-tight">${snap.agent_name || "Clever Star"}</div>
              <div class="text-[11px] text-mute font-mono">bot ${BOT_ID.slice(0,8)} · ${connected ? "live" : "reconnecting…"}</div>
            </div>
          </div>
          <${StatusPill} voice=${snap.voice} userDriving=${snap.user_driving}/>
        </div>
        <${TabBar} active=${active} onPick=${onPick}/>
      </header>
      <main class="flex-1 overflow-hidden">${body}</main>
    </div>
  `;
}

createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
